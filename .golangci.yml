version: "2"

run:
  # default concurrency is a available CPU number
  concurrency: 4

  # timeout for analysis, e.g. 30s, 5m, default is 1m
  timeout: 10m

  # exit code when at least one issue was found, default is 1
  issues-exit-code: 1

  # include test files or not, default is true
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unused

  settings:
    errcheck:
      # report about not checking of errors in type assertions: `a := b.(MyStruct)`;
      # default is false: such cases aren't reported by default.
      check-type-assertions: false

      # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`;
      # default is false: such cases aren't reported by default.
      check-blank: false

    staticcheck:
      # Keep the historical scope of this linter: bug-pattern (SA) and
      # simplification (S1) checks only. The stylecheck (ST) and quickfix (QF)
      # groups were folded into the "staticcheck" linter name in golangci-lint
      # v2 but were never enabled here, and turning them on now would surface
      # a large amount of pre-existing, unrelated style debt.
      checks:
        - all
        - "-ST*"
        - "-QF*"

  exclusions:
    rules:
      # Exclude gosimple bool check (reported under the staticcheck linter in v2)
      - linters:
          - staticcheck
        text: "S(1002|1008|1021)"
      # Exclude failing staticchecks for now
      - linters:
          - staticcheck
        text: "SA(1006|1019|4006|4010|4017|5007|6005|9004):"

    # Which file paths to exclude: they will be analyzed, but issues from them
    # won't be reported.
    paths:
      - ".*\\.hcl2spec\\.go$"

formatters:
  enable:
    - goimports

# Maximum issues count per one linter. Set to 0 to disable. Default is 50.
# Maximum count of issues with the same text. Set to 0 to disable. Default is 3.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
